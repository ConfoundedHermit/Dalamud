name: Check fork submodule updates

on:
  schedule:
    - cron: '0 */6 * * *' # Every six hours, in UTC.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-submodule-updates
  cancel-in-progress: false

jobs:
  check:
    if: >-
      github.repository == 'ConfoundedHermit/DalamudPlus' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || vars.ENABLE_SUBMODULE_UPDATES == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        submodule: [clientstructs, excel]
    steps:
      - name: Checkout fork main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.FORK_AUTOMATION_TOKEN || github.token }}
      - name: Prepare dependency update PR
        env:
          GH_TOKEN: ${{ secrets.FORK_AUTOMATION_TOKEN || github.token }}
          FORK_REPOSITORY: ${{ github.repository }}
          SUBMODULE: ${{ matrix.submodule }}
        run: python3 tools/update-fork-submodule.py --submodule "$SUBMODULE" --repository "$FORK_REPOSITORY"
