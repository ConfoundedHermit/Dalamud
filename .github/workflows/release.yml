name: Release Dalamud Plus

on:
  release:
    types: [published]

concurrency:
  group: release_dalamud_${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and upload Windows release
    if: github.repository == 'ConfoundedHermit/DalamudPlus' && startsWith(github.event.release.tag_name, 'dalamud-plus/v')
    runs-on: windows-2025
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout release commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Verify fork release provenance
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if (-not $env:RELEASE_TAG.StartsWith('dalamud-plus/v', [StringComparison]::Ordinal)) {
            throw 'Fork release tags must start with dalamud-plus/v.'
          }

          $tagCommit = git rev-parse --verify "refs/tags/$($env:RELEASE_TAG)^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the release tag.' }
          $checkoutCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the checkout commit.' }
          if ($tagCommit -ne $checkoutCommit) { throw 'The checkout does not match the release tag.' }

          git merge-base --is-ancestor 67116866f0e8fc0bd6d3aa753bdc2cee96ee8613 $tagCommit
          if ($LASTEXITCODE -ne 0) { throw 'The release must include the fork integration commit.' }
          git merge-base --is-ancestor $tagCommit refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'The release commit must belong to main.' }

      - name: Setup .NET
        uses: actions/setup-dotnet@55ec9447dda3d1cf6bd587150f3262f30ee10815 # v3
        with:
          dotnet-version: '10.0.100'

      - name: Define VERSION
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          @(
            ($env:GITHUB_REPOSITORY -replace '.*/')
            $env:RELEASE_TAG
            $env:GITHUB_SHA.Substring(0, 7)
          ) | Set-Content -LiteralPath VERSION

      - name: Generate native projects
        run: .\generate.cmd vs2026

      - name: Build Dalamud
        run: .\build.cmd Release

      - name: Test Dalamud
        run: dotnet test Dalamud.Test/Dalamud.Test.csproj -c Release -tl:off -p:WarningLevel=0

      - name: Create hashlist
        run: .\tools\create_hashlist.ps1 .\bin\Release

      - name: Package release
        run: |
          $requiredFiles = @(
            'Dalamud.dll', 'Dalamud.deps.json', 'Dalamud.runtimeconfig.json',
            'Dalamud.Boot.dll', 'Dalamud.Injector.exe', 'Dalamud.Injector.dll',
            'Dalamud.Injector.deps.json', 'Dalamud.Injector.runtimeconfig.json',
            'DalamudCrashHandler.exe', 'FFXIVClientStructs.dll',
            'cimgui.dll', 'cimplot.dll', 'cimguizmo.dll', 'nethost.dll',
            'hashes.json', 'commit_hash.txt', 'revision.txt', 'TEMP_gitver.txt'
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path -LiteralPath (Join-Path .\bin\Release $file) -PathType Leaf)) {
              throw "Release bundle is missing $file"
            }
          }

          # Keep the output contents at the ZIP root for a Dalamud directory override.
          Compress-Archive -Path .\bin\Release\* -DestinationPath .\Dalamud-win-x64.zip -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath .\Dalamud-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Dalamud-win-x64.zip" | Set-Content -LiteralPath .\Dalamud-win-x64.zip.sha256 -Encoding ascii

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$env:RELEASE_TAG" .\Dalamud-win-x64.zip .\Dalamud-win-x64.zip.sha256 --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
