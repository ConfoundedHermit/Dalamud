name: Generate Dalamud Plus release notes

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact fork release tag (dalamud-plus/v...)
        required: true
        type: string
      previous_tag:
        description: Earlier fork tag (blank selects the nearest ancestral fork release)
        required: false
        type: string
  push:
    tags:
      - 'dalamud-plus/v*'
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: changelog_${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  generate:
    if: >-
      github.repository == 'ConfoundedHermit/DalamudPlus' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') &&
      startsWith(github.event.release.tag_name || inputs.tag || github.ref_name, 'dalamud-plus/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout selected release
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify fork release provenance
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
        run: |
          if (-not $env:RELEASE_TAG.StartsWith('dalamud-plus/v', [StringComparison]::Ordinal)) {
            throw 'Fork release tags must start with dalamud-plus/v.'
          }

          $tagCommit = git rev-parse --verify "refs/tags/$($env:RELEASE_TAG)^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the release tag.' }
          $checkoutCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the checkout commit.' }
          if ($tagCommit -ne $checkoutCommit) { throw 'The checkout does not match the release tag.' }

          git merge-base --is-ancestor 67116866f0e8fc0bd6d3aa753bdc2cee96ee8613 $tagCommit
          if ($LASTEXITCODE -ne 0) { throw 'The release must include the fork integration commit.' }
          git merge-base --is-ancestor $tagCommit refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'The release commit must belong to main.' }
      - name: Generate notes from the selected fork range
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          python3 .github/generate_changelog.py --tag "$RELEASE_TAG" --previous-tag "$PREVIOUS_TAG" --repository "$GITHUB_REPOSITORY" --output release-notes.md
      - name: Retain generated release notes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dalamud-plus-release-notes
          path: release-notes.md
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout release publisher
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Download generated notes
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          name: dalamud-plus-release-notes
      - name: Update generated section and preserve human release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 .github/generate_changelog.py --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" --publish-notes-file release-notes.md
