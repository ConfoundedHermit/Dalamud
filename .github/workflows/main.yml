name: Build Dalamud Plus
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: build_dalamud_${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build on Windows (${{ matrix.configuration }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    env:
      CONFIGURATION: ${{ matrix.configuration }}
      IS_RELEASE: ${{ matrix.configuration == 'Release' }}
    steps:
      - name: Checkout Dalamud Plus
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-dotnet@55ec9447dda3d1cf6bd587150f3262f30ee10815 # v3
        with:
          dotnet-version: '10.0.100'
      - name: Define VERSION
        run: |
          $env:COMMIT = $env:GITHUB_SHA.Substring(0, 7)
          $env:REPO_NAME = $env:GITHUB_REPOSITORY -replace '.*/'
          $env:BRANCH = $env:GITHUB_REF -replace '.*/'

          ($env:REPO_NAME) >> VERSION
          ($env:BRANCH) >> VERSION
          ($env:COMMIT) >> VERSION
      - name: Build native projects
        run: |
          cmake --preset vs2026
          cmake --build build --config $env:CONFIGURATION -- "/clp:NoSummary;ForceNoAlign"
      - name: Build Dalamud
        run: |
          dotnet build Dalamud/Dalamud.csproj -c $env:CONFIGURATION -tl:off "/clp:NoSummary;ForceNoAlign"
          dotnet build Dalamud.Injector/Dalamud.Injector.csproj -c $env:CONFIGURATION -tl:off "/clp:NoSummary;ForceNoAlign"
      - name: Test Dalamud
        run: dotnet test Dalamud.Test/Dalamud.Test.csproj -c $env:CONFIGURATION -tl:off -p:WarningLevel=0
      - name: Create hashlist
        if: ${{ env.IS_RELEASE == 'true' }}
        run: .\tools\create_hashlist.ps1 .\bin\Release
      - name: Upload artifact
        if: ${{ env.IS_RELEASE == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dalamud-artifact
          path: bin\Release

  check_api_compat:
    name: "Check API Compatibility"
    if: ${{ github.event_name == 'pull_request' }}
    needs: build
    runs-on: windows-latest
    steps:
    - name: "Install .NET SDK"
      uses: actions/setup-dotnet@55ec9447dda3d1cf6bd587150f3262f30ee10815 # v3
      with:
        dotnet-version: '10.0.100'
    - name: "Install ApiCompat"
      run: |
        dotnet tool install -g Microsoft.DotNet.ApiCompat.Tool
    - name: "Download Proposed Artifacts"
      uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
      with:
        name: dalamud-artifact
        path: .\right
    - name: "Download upstream API baseline"
      run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/stg/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "left"
    - name: "Verify Compatibility"
      run: |
        $FILES_TO_VALIDATE = "Dalamud.dll","FFXIVClientStructs.dll","Lumina.dll","Lumina.Excel.dll"

        $retcode = 0

        foreach ($file in $FILES_TO_VALIDATE) {
            $testout = ""
            Write-Output "::group::=== API COMPATIBILITY CHECK: ${file} ==="
            apicompat -l "left\${file}" -r "right\${file}" --noWarn "CP0006" | Tee-Object -Variable testout
            Write-Output "::endgroup::"
            if ($testout -ne "APICompat ran successfully without finding any breaking changes.") {
                Write-Output "::error::${file} did not pass. Please review it for problems."
                $retcode = 1
            }
        }

        exit $retcode
